# Baut das Desktop-Programm für Windows und Linux (Steam Deck).
# Start: auf GitHub unter „Actions“ → „Desktop-Build“ → „Run workflow“, oder automatisch bei einem Tag v*.
name: Desktop-Build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: dist:win
            steam: dist:steam-win
            dir: win-unpacked
          - os: ubuntu-latest
            target: dist:linux
            steam: dist:steam-linux
            dir: linux-unpacked
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Entpackter Ordner für den Steam-Upload (SteamPipe)
      - run: npm run ${{ matrix.steam }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: frontlinien-steam-${{ matrix.dir }}
          path: dist/${{ matrix.dir }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontlinien-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error
