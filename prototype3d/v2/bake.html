<!doctype html><html><head><meta charset="utf-8"><script type="importmap">{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }</script></head><body><script type="module">

const hex = c => '#' + c.getHexString();
function classify(mesh, era) {

  const big = tri.filter(x => x[2] > 300).reduce((s, x) => s + x[2], 0), small = total - big;

const variants = [];
const INF_W = ['club', 'spear', 'sword', 'spear', 'halberd', 'musket', 'rifle'];
const RNG_W = ['sling', 'bow', 'bow', 'bow', 'crossbow', 'rifle', 'rifle'];
for (const pose of ['idle', 'walk', 'walk2', 'attack']) variants.push([`worker_${pose}`, 1, { civilian: true, weapon: 'tool', era: 1, pose, seed: 4, helmet: false }]);
for (let e = 0; e < 7; e++) for (const pose of ['idle', 'walk', 'walk2', 'attack']) variants.push([`inf${e}_${pose}`, e, { era: e, weapon: INF_W[e], shield: e >= 1 && e <= 3, pose, seed: 3 + e, greatHelm: false }]);
for (let e = 0; e < 7; e++) for (const pose of ['idle', 'walk', 'walk2', 'aim']) variants.push([`rng${e}_${pose}`, e, { era: e, weapon: RNG_W[e], pose, seed: 20 + e }]);

for (const [key, era, o] of variants) store(key, bake(H.soldierR({ color: SENT, cell: 0.02, ...o }), era, 2400));

const total = new Uint8Array(off); let p = 0; for (const c of chunks) { total.set(c, p); p += c.byteLength; }
let bin = ''; for (let i = 0; i < total.length; i += 0x8000) bin += String.fromCharCode.apply(null, total.subarray(i, i + 0x8000));
